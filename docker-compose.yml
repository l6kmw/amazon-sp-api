# Production Compose binds host loopback only. PostgreSQL/Redis are external:
# put URLs in private config.yaml (storage.postgres / storage.redis), never here.
services:
  amazon-sp-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Acceptance evidence must set AMAZON_IMAGE_TAG to a commit-based unique value (not latest).
    image: amazon-sp-api:${AMAZON_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AMAZON_OAUTH_PORT:-8788}:8788"
      - "127.0.0.1:${AMAZON_MCP_PORT:-8789}:8789"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
      - type: bind
        source: ./data
        target: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 15s
