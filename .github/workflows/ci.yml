name: CI

on:
  push:
    branches: [solo]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Acceptance script tests
        run: bun run test:verify-script

      - name: Build
        run: bun run build
