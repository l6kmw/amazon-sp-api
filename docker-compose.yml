# Single-user Compose. Binds host loopback only; no database services are needed.
services:
  amazon-sp-api:
    platform: ${AMAZON_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        AMAZON_IMAGE_REVISION: ${AMAZON_IMAGE_REVISION:-local}
        AMAZON_IMAGE_VERSION: ${AMAZON_IMAGE_TAG:-local}
    # Acceptance evidence must set AMAZON_IMAGE_TAG to a commit-based unique value (not latest).
    image: ${AMAZON_IMAGE_REPOSITORY:-amazon-sp-api}:${AMAZON_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:${AMAZON_PORT:-8789}:8789"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
      - type: bind
        source: ./data
        target: /data
    # 仅为用户在 config.yaml 中明确配置的宿主机 PostgreSQL/Redis 保留；
    # 应用不会自动访问宿主机 8080 或任何外部身份服务。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 15s
